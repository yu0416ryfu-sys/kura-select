<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" width="600" height="470" font-family="'Hiragino Sans','Noto Sans JP',system-ui,sans-serif">
  <title>東京の月別平均湿度（平年値）</title>
  <rect width="600" height="470" fill="#ffffff"/>
  <text x="300" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2937">東京の月別の平均湿度（平年値）</text>
  <text x="300" y="70" text-anchor="middle" font-size="16" fill="#6b7280">12月〜3月は60%を下回る。暖房中の室内はさらに乾きやすい</text>
  <line x1="60" y1="360" x2="580" y2="360" stroke="#e5e7eb" stroke-width="1"/>
  <text x="52" y="365" text-anchor="end" font-size="14" fill="#6b7280">0%</text>
  <line x1="60" y1="295" x2="580" y2="295" stroke="#e5e7eb" stroke-width="1"/>
  <text x="52" y="300" text-anchor="end" font-size="14" fill="#6b7280">20%</text>
  <line x1="60" y1="230" x2="580" y2="230" stroke="#e5e7eb" stroke-width="1"/>
  <text x="52" y="235" text-anchor="end" font-size="14" fill="#6b7280">40%</text>
  <line x1="60" y1="165" x2="580" y2="165" stroke="#e5e7eb" stroke-width="1"/>
  <text x="52" y="170" text-anchor="end" font-size="14" fill="#6b7280">60%</text>
  <line x1="60" y1="100" x2="580" y2="100" stroke="#e5e7eb" stroke-width="1"/>
  <text x="52" y="105" text-anchor="end" font-size="14" fill="#6b7280">80%</text>
  <line x1="60" y1="165" x2="580" y2="165" stroke="#b42318" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="70" y="194.25" width="30" height="165.75" rx="3" fill="#d9701f"/>
  <text x="85" y="216.25" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">51</text>
  <text x="85" y="382" text-anchor="middle" font-size="14" fill="#374151">1月</text>
  <rect x="112.5" y="191" width="30" height="169.00" rx="3" fill="#d9701f"/>
  <text x="127.5" y="213.00" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">52</text>
  <text x="127.5" y="382" text-anchor="middle" font-size="14" fill="#374151">2月</text>
  <rect x="155" y="174.75" width="30" height="185.25" rx="3" fill="#d9701f"/>
  <text x="170" y="196.75" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">57</text>
  <text x="170" y="382" text-anchor="middle" font-size="14" fill="#374151">3月</text>
  <rect x="197.5" y="158.5" width="30" height="201.50" rx="3" fill="#9ab8e6"/>
  <text x="212.5" y="150.5" text-anchor="middle" font-size="14" font-weight="400" fill="#374151">62</text>
  <text x="212.5" y="382" text-anchor="middle" font-size="14" fill="#374151">4月</text>
  <rect x="240" y="139" width="30" height="221.00" rx="3" fill="#9ab8e6"/>
  <text x="255" y="131" text-anchor="middle" font-size="14" font-weight="400" fill="#374151">68</text>
  <text x="255" y="382" text-anchor="middle" font-size="14" fill="#374151">5月</text>
  <rect x="282.5" y="116.25" width="30" height="243.75" rx="3" fill="#9ab8e6"/>
  <text x="297.5" y="108.25" text-anchor="middle" font-size="14" font-weight="400" fill="#374151">75</text>
  <text x="297.5" y="382" text-anchor="middle" font-size="14" fill="#374151">6月</text>
  <rect x="325" y="113" width="30" height="247.00" rx="3" fill="#9ab8e6"/>
  <text x="340" y="105" text-anchor="middle" font-size="14" font-weight="400" fill="#374151">76</text>
  <text x="340" y="382" text-anchor="middle" font-size="14" fill="#374151">7月</text>
  <rect x="367.5" y="119.5" width="30" height="240.50" rx="3" fill="#9ab8e6"/>
  <text x="382.5" y="111.5" text-anchor="middle" font-size="14" font-weight="400" fill="#374151">74</text>
  <text x="382.5" y="382" text-anchor="middle" font-size="14" fill="#374151">8月</text>
  <rect x="410" y="116.25" width="30" height="243.75" rx="3" fill="#9ab8e6"/>
  <text x="425" y="108.25" text-anchor="middle" font-size="14" font-weight="400" fill="#374151">75</text>
  <text x="425" y="382" text-anchor="middle" font-size="14" fill="#374151">9月</text>
  <rect x="452.5" y="129.25" width="30" height="230.75" rx="3" fill="#9ab8e6"/>
  <text x="467.5" y="121.25" text-anchor="middle" font-size="14" font-weight="400" fill="#374151">71</text>
  <text x="467.5" y="382" text-anchor="middle" font-size="14" fill="#374151">10月</text>
  <rect x="495" y="152" width="30" height="208.00" rx="3" fill="#9ab8e6"/>
  <text x="510" y="144" text-anchor="middle" font-size="14" font-weight="400" fill="#374151">64</text>
  <text x="510" y="382" text-anchor="middle" font-size="14" fill="#374151">11月</text>
  <rect x="537.5" y="178" width="30" height="182.00" rx="3" fill="#d9701f"/>
  <text x="552.5" y="200.00" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">56</text>
  <text x="552.5" y="382" text-anchor="middle" font-size="14" fill="#374151">12月</text>
  <line x1="150" y1="406" x2="186" y2="406" stroke="#b42318" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="194" y="411" font-size="14" fill="#b42318">室内の湿度の目安 60%（皮膚科医の解説）</text>
  <text x="300" y="438" text-anchor="middle" font-size="13" fill="#6b7280">出典: 気象庁「平年値（統計期間1991〜2020年）」東京の平均相対湿度（屋外）</text>
  <text x="300" y="456" text-anchor="middle" font-size="13" fill="#6b7280">室内の目安: メディカルノート 安部正敏医師監修「皮脂欠乏症」の記事</text>
</svg>
