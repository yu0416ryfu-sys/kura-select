<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" font-family="'Hiragino Sans','Noto Sans JP',system-ui,sans-serif">
  <title>洗顔料1本で何日もつか</title>
  <rect width="600" height="420" fill="#ffffff"/>
  <text x="300" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2937">150入りの洗顔料は何日もつか</text>
  <text x="300" y="76" text-anchor="middle" font-size="17" fill="#6b7280">朝晩の1日2回使った場合の計算</text>

  <!-- 基線 -->
  <line x1="196" y1="104" x2="196" y2="368" stroke="#d1d5db" stroke-width="1"/>

  <!-- 1回1g: 75日 -->
  <text x="184" y="128" text-anchor="end" font-size="16" fill="#374151">チューブ150g</text>
  <text x="184" y="150" text-anchor="end" font-size="16" fill="#374151">1回1g（約1cm）</text>
  <rect x="196" y="120" width="300" height="30" rx="4" fill="#2f6f9f"/>
  <text x="506" y="142" font-size="18" font-weight="700" fill="#1f2937">75日</text>

  <!-- 1回2g: 37日 -->
  <text x="184" y="192" text-anchor="end" font-size="16" fill="#374151">チューブ150g</text>
  <text x="184" y="214" text-anchor="end" font-size="16" fill="#374151">1回2g（約2cm）</text>
  <rect x="196" y="184" width="148" height="30" rx="4" fill="#2f6f9f"/>
  <text x="354" y="206" font-size="18" font-weight="700" fill="#1f2937">37日</text>

  <!-- 1回3g: 25日 -->
  <text x="184" y="256" text-anchor="end" font-size="16" fill="#374151">チューブ150g</text>
  <text x="184" y="278" text-anchor="end" font-size="16" fill="#374151">1回3g（約3cm）</text>
  <rect x="196" y="248" width="100" height="30" rx="4" fill="#2f6f9f"/>
  <text x="306" y="270" font-size="18" font-weight="700" fill="#1f2937">25日</text>

  <!-- ポンプ泡: 30日 -->
  <text x="184" y="320" text-anchor="end" font-size="16" fill="#374151">ポンプの泡150mL</text>
  <text x="184" y="342" text-anchor="end" font-size="16" fill="#374151">約60回分の表示</text>
  <rect x="196" y="312" width="120" height="30" rx="4" fill="#d9822b"/>
  <text x="326" y="334" font-size="18" font-weight="700" fill="#1f2937">30日</text>

  <text x="300" y="398" text-anchor="middle" font-size="15" fill="#6b7280">1cmを約1gとした目安。実際の量は口の太さで変わります</text>
</svg>
