<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" width="600" height="560" font-family="'Hiragino Sans','Noto Sans JP',system-ui,sans-serif">
  <title>すすぎ残しやすい場所</title>
  <rect width="600" height="560" fill="#ffffff"/>
  <text x="300" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2937">すすぎ残しやすい場所</text>
  <text x="300" y="76" text-anchor="middle" font-size="17" fill="#6b7280">流水で約1分すすぎ、最後にこの5か所を確かめる</text>

  <!-- 顔 -->
  <path d="M212 268 C212 180 250 136 300 136 C350 136 388 180 388 268 C388 348 350 416 300 416 C250 416 212 348 212 268 Z" fill="#fdf1e6" stroke="#b08968" stroke-width="2.5"/>
  <!-- 耳 -->
  <path d="M212 256 C196 248 192 288 212 306" fill="#fdf1e6" stroke="#b08968" stroke-width="2.5"/>
  <path d="M388 256 C404 248 408 288 388 306" fill="#fdf1e6" stroke="#b08968" stroke-width="2.5"/>
  <!-- 髪の生え際 -->
  <path d="M214 232 C214 164 254 124 300 124 C346 124 386 164 386 232 C360 192 336 178 300 178 C264 178 240 192 214 232 Z" fill="#6b5b53"/>
  <!-- 目・鼻・口 -->
  <path d="M250 254 Q266 244 282 254" fill="none" stroke="#6b5b53" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M318 254 Q334 244 350 254" fill="none" stroke="#6b5b53" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M300 270 L292 318 Q300 326 308 318" fill="none" stroke="#b08968" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M274 360 Q300 374 326 360" fill="none" stroke="#b08968" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 印と引き出し線 -->
  <g fill="#2f6fdb">
    <circle cx="300" cy="182" r="9"/>
    <circle cx="228" cy="240" r="9"/>
    <circle cx="396" cy="282" r="9"/>
    <circle cx="282" cy="316" r="9"/>
    <circle cx="300" cy="426" r="9"/>
  </g>
  <g stroke="#2f6fdb" stroke-width="1.5" fill="none">
    <path d="M300 173 L300 112 L410 112"/>
    <path d="M219 240 L140 240"/>
    <path d="M405 282 L446 282"/>
    <path d="M273 316 L140 316"/>
    <path d="M300 435 L300 470"/>
  </g>
  <g font-size="18" font-weight="700" fill="#1f2937">
    <text x="418" y="118">髪の生え際</text>
    <text x="134" y="246" text-anchor="end">こめかみ</text>
    <text x="454" y="288">耳の前後</text>
    <text x="134" y="322" text-anchor="end">小鼻の脇</text>
    <text x="300" y="496" text-anchor="middle">あごの下</text>
  </g>
  <text x="300" y="534" text-anchor="middle" font-size="15" fill="#6b7280">出典の目安: 資生堂の冬のスキンケアの解説（約1分・こめかみ・耳の前後）</text>
</svg>
