<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" width="600" height="720" font-family="'Hiragino Sans','Noto Sans JP',system-ui,sans-serif">
  <title>市販の白髪染めの選び方（かぶれの経験・染め方・色を入れる場面の順）</title>
  <rect width="600" height="720" fill="#ffffff"/>
  <text x="300" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2937">市販の白髪染めの選び方</text>
  <text x="300" y="66" text-anchor="middle" font-size="15" fill="#6b7280">上から順に答えていくと、選ぶ種類が決まる</text>

  <!-- 質問1 -->
  <rect x="60" y="88" width="480" height="64" rx="10" fill="#fff7ed" stroke="#d9701f" stroke-width="2"/>
  <text x="300" y="116" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">ヘアカラーで、かぶれ・かゆみ・はれが</text>
  <text x="300" y="140" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">出たことがある？</text>

  <line x1="300" y1="152" x2="300" y2="180" stroke="#9ca3af" stroke-width="2"/>
  <line x1="150" y1="180" x2="450" y2="180" stroke="#9ca3af" stroke-width="2"/>
  <line x1="150" y1="180" x2="150" y2="204" stroke="#9ca3af" stroke-width="2"/>
  <line x1="450" y1="180" x2="450" y2="204" stroke="#9ca3af" stroke-width="2"/>
  <text x="140" y="198" text-anchor="end" font-size="15" font-weight="700" fill="#b91c1c">ある</text>
  <text x="460" y="198" font-size="15" font-weight="700" fill="#2f6fb5">ない</text>

  <!-- ある -->
  <rect x="24" y="206" width="252" height="168" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="150" y="234" text-anchor="middle" font-size="16" font-weight="700" fill="#b91c1c">ヘアカラー（酸化染毛剤）は</text>
  <text x="150" y="256" text-anchor="middle" font-size="16" font-weight="700" fill="#b91c1c">使わない</text>
  <text x="150" y="282" text-anchor="middle" font-size="14" fill="#374151">パッチテストもしない</text>
  <text x="150" y="306" text-anchor="middle" font-size="14" fill="#374151">化粧品の染毛料（トリートメント・</text>
  <text x="150" y="326" text-anchor="middle" font-size="14" fill="#374151">シャンプー）も注意書きを読み、</text>
  <text x="150" y="346" text-anchor="middle" font-size="14" fill="#374151">ヘナや不安があれば医師に相談</text>

  <!-- 質問2 -->
  <rect x="324" y="206" width="252" height="84" rx="10" fill="#eff6ff" stroke="#2f6fb5" stroke-width="2"/>
  <text x="450" y="234" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">1回でしっかり染めて、</text>
  <text x="450" y="256" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">長くもたせたい？</text>
  <text x="450" y="278" text-anchor="middle" font-size="13" fill="#6b7280">（色持ちは2〜3か月が目安）</text>

  <line x1="450" y1="290" x2="450" y2="314" stroke="#9ca3af" stroke-width="2"/>
  <text x="460" y="308" font-size="15" font-weight="700" fill="#2f6fb5">はい</text>
  <rect x="324" y="316" width="252" height="104" rx="10" fill="#2f6fb5"/>
  <text x="450" y="344" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">白髪用のヘアカラー</text>
  <text x="450" y="366" text-anchor="middle" font-size="14" fill="#ffffff">（医薬部外品）</text>
  <text x="450" y="390" text-anchor="middle" font-size="14" fill="#ffffff">毎回、染める48時間前に</text>
  <text x="450" y="410" text-anchor="middle" font-size="14" fill="#ffffff">パッチテスト</text>

  <!-- いいえ → 質問3 -->
  <path d="M 324 248 L 300 248 L 300 446" fill="none" stroke="#9ca3af" stroke-width="2"/>
  <text x="292" y="436" text-anchor="end" font-size="15" font-weight="700" fill="#2e7d4f">いいえ（少しずつでよい）</text>
  <rect x="60" y="448" width="480" height="56" rx="10" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="2"/>
  <text x="300" y="483" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">色を入れるのは、どの場面？</text>

  <line x1="300" y1="504" x2="300" y2="524" stroke="#9ca3af" stroke-width="2"/>
  <line x1="104" y1="524" x2="496" y2="524" stroke="#9ca3af" stroke-width="2"/>
  <line x1="104" y1="524" x2="104" y2="542" stroke="#9ca3af" stroke-width="2"/>
  <line x1="300" y1="524" x2="300" y2="542" stroke="#9ca3af" stroke-width="2"/>
  <line x1="496" y1="524" x2="496" y2="542" stroke="#9ca3af" stroke-width="2"/>

  <rect x="16" y="544" width="176" height="112" rx="10" fill="#ffffff" stroke="#2e7d4f" stroke-width="2"/>
  <text x="104" y="570" text-anchor="middle" font-size="14" fill="#374151">毎回の洗髪で</text>
  <text x="104" y="598" text-anchor="middle" font-size="17" font-weight="700" fill="#2e7d4f">カラー</text>
  <text x="104" y="620" text-anchor="middle" font-size="17" font-weight="700" fill="#2e7d4f">シャンプー</text>
  <text x="104" y="644" text-anchor="middle" font-size="13" fill="#6b7280">塗って数分〜置く</text>

  <rect x="212" y="544" width="176" height="112" rx="10" fill="#ffffff" stroke="#2e7d4f" stroke-width="2"/>
  <text x="300" y="570" text-anchor="middle" font-size="14" fill="#374151">洗髪後や乾いた髪に</text>
  <text x="300" y="598" text-anchor="middle" font-size="17" font-weight="700" fill="#2e7d4f">カラー</text>
  <text x="300" y="620" text-anchor="middle" font-size="17" font-weight="700" fill="#2e7d4f">トリートメント</text>
  <text x="300" y="644" text-anchor="middle" font-size="13" fill="#6b7280">続けて使い、色を重ねる</text>

  <rect x="408" y="544" width="176" height="112" rx="10" fill="#ffffff" stroke="#2e7d4f" stroke-width="2"/>
  <text x="496" y="570" text-anchor="middle" font-size="14" fill="#374151">時間をとって</text>
  <text x="496" y="609" text-anchor="middle" font-size="17" font-weight="700" fill="#2e7d4f">ヘナ</text>
  <text x="496" y="644" text-anchor="middle" font-size="13" fill="#6b7280">毎回パッチテスト</text>

  <text x="300" y="686" text-anchor="middle" font-size="13" fill="#6b7280">黒髪用（おしゃれ染め）は白髪がよく染まらないことがある（花王）。</text>
  <text x="300" y="706" text-anchor="middle" font-size="13" fill="#6b7280">区分と色持ちは日本ヘアカラー工業会、パッチテストは同会・消費者安全調査委員会</text>
</svg>
