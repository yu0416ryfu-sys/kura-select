<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" font-family="'Hiragino Sans','Noto Sans JP',system-ui,sans-serif">
  <title>メラミンスポンジ1個の大きさの違い</title>
  <rect width="600" height="600" fill="#ffffff"/>
  <text x="300" y="42" text-anchor="middle" font-size="25" font-weight="700" fill="#1f2937">「1個」の大きさはこんなに違う</text>
  <text x="300" y="72" text-anchor="middle" font-size="16" fill="#6b7280">いちばん広い面を同じ縮尺で並べた図（厚みは下に記載）</text>
  <line x1="20" y1="420" x2="580" y2="420" stroke="#d1d5db" stroke-width="2"/>
  <!-- 小さなブロック 35×27mm → 42×32px -->
  <rect x="39" y="388" width="42" height="32" rx="3" fill="#eef5fc" stroke="#2f6fb5" stroke-width="2"/>
  <!-- キューブ 34×40mm → 41×48px -->
  <rect x="144" y="372" width="41" height="48" rx="3" fill="#eef5fc" stroke="#2f6fb5" stroke-width="2"/>
  <!-- カット済み小片 45×20mm → 54×24px -->
  <rect x="243" y="396" width="54" height="24" rx="3" fill="#eef5fc" stroke="#2f6fb5" stroke-width="2"/>
  <!-- 大判 75×120mm → 90×144px -->
  <rect x="340" y="276" width="90" height="144" rx="4" fill="#edf7f1" stroke="#2f8a57" stroke-width="2"/>
  <!-- 縦長の大判 83×250mm → 100×300px -->
  <rect x="468" y="120" width="100" height="300" rx="4" fill="#edf7f1" stroke="#2f8a57" stroke-width="2"/>
  <g font-size="15" fill="#374151" text-anchor="middle">
    <text x="60" y="448" font-weight="700" fill="#1f2937">小さな</text>
    <text x="60" y="467" font-weight="700" fill="#1f2937">ブロック</text>
    <text x="60" y="490">約3.5×2.7</text>
    <text x="60" y="510">×2cm</text>
    <text x="164" y="448" font-weight="700" fill="#1f2937">キューブ</text>
    <text x="164" y="490">約3.4×4cm</text>
    <text x="164" y="510">厚み約3cm</text>
    <text x="270" y="448" font-weight="700" fill="#1f2937">カット済み</text>
    <text x="270" y="467" font-weight="700" fill="#1f2937">の小片</text>
    <text x="270" y="490">約4.5×2cm</text>
    <text x="270" y="510">厚み約2.9cm</text>
    <text x="385" y="448" font-weight="700" fill="#1f2937">大判</text>
    <text x="385" y="490">約7.5×12cm</text>
    <text x="385" y="510">厚み約2.9cm</text>
    <text x="518" y="448" font-weight="700" fill="#1f2937">縦長の大判</text>
    <text x="518" y="490">約8.3×25cm</text>
    <text x="518" y="510">厚み約2.9cm</text>
  </g>
  <g font-size="14" font-weight="700" text-anchor="middle">
    <text x="60" y="536" fill="#1f4f87">大判の約1/14</text>
    <text x="164" y="536" fill="#1f4f87">約1/6〜1/7</text>
    <text x="270" y="536" fill="#1f4f87">約1/10</text>
    <text x="385" y="536" fill="#1f6b43">基準</text>
    <text x="518" y="536" fill="#1f6b43">大判の約2.3倍</text>
  </g>
  <text x="300" y="576" text-anchor="middle" font-size="15" fill="#6b7280">下の段は体積の比。1個あたりの値段は同じ大きさの中で比べる</text>
</svg>
