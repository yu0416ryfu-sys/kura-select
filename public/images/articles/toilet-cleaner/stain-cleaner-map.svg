<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1073" width="600" height="1073" font-family="'Hiragino Sans','Noto Sans JP',system-ui,sans-serif">
  <title>トイレの汚れと、効く洗剤</title>
  <rect width="600" height="1073" fill="#ffffff"/>
  <text x="300" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2937">トイレの汚れと、効く洗剤</text>
  <text x="300" y="76" text-anchor="middle" font-size="17" fill="#6b7280">落ちないときは、力ではなく液性を疑う</text>
  <rect x="20" y="102" width="560" height="252" rx="14" fill="#eef5fc" stroke="#8db6e3" stroke-width="2"/>
  <rect x="40" y="120" width="160" height="40" rx="20" fill="#2f6fb5"/>
  <text x="120" y="147" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">黄ばみ・尿石</text>
  <text x="40" y="198" font-size="19" fill="#374151">便器のフチ裏や水際の、ざらざらした固い付着物</text>
  <line x1="300" y1="210" x2="300" y2="232" stroke="#2f6fb5" stroke-width="3"/>
  <path d="M290 228 L300 242 L310 228 Z" fill="#2f6fb5"/>
  <text x="318" y="232" font-size="17" font-weight="700" fill="#1f4f87">固まったカルシウム分を溶かす</text>
  <rect x="40" y="252" width="520" height="84" rx="10" fill="#ffffff" stroke="#8db6e3" stroke-width="1.5"/>
  <text x="60" y="286" font-size="22" font-weight="700" fill="#1f2937">酸性の洗剤</text>
  <text x="182" y="285" font-size="16" fill="#6b7280">手袋推奨</text>
  <text x="60" y="318" font-size="17" fill="#374151">金属部分やタイル目地を傷めることがある</text>
  <rect x="20" y="374" width="560" height="252" rx="14" fill="#edf7f1" stroke="#8fc9a8" stroke-width="2"/>
  <rect x="40" y="392" width="100" height="40" rx="20" fill="#2f8a5b"/>
  <text x="90" y="419" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">黒ずみ</text>
  <text x="40" y="470" font-size="19" fill="#374151">水が溜まる部分の輪郭に沿って出る、カビや雑菌の汚れ</text>
  <line x1="300" y1="482" x2="300" y2="504" stroke="#2f8a5b" stroke-width="3"/>
  <path d="M290 500 L300 514 L310 500 Z" fill="#2f8a5b"/>
  <text x="318" y="504" font-size="17" font-weight="700" fill="#1d5e3d">分解・漂白する</text>
  <rect x="40" y="524" width="520" height="84" rx="10" fill="#ffffff" stroke="#8fc9a8" stroke-width="1.5"/>
  <text x="60" y="558" font-size="22" font-weight="700" fill="#1f2937">塩素系の洗剤</text>
  <text x="204" y="557" font-size="16" fill="#6b7280">換気必須</text>
  <text x="60" y="590" font-size="17" fill="#374151">色柄物や金属に付けない</text>
  <rect x="20" y="646" width="560" height="252" rx="14" fill="#f5f6f7" stroke="#c9ced4" stroke-width="2"/>
  <rect x="40" y="664" width="180" height="40" rx="20" fill="#4b5563"/>
  <text x="130" y="691" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">日常の軽い汚れ</text>
  <text x="40" y="742" font-size="19" fill="#374151">まだ固着していない段階の汚れ</text>
  <line x1="300" y1="754" x2="300" y2="776" stroke="#4b5563" stroke-width="3"/>
  <path d="M290 772 L300 786 L310 772 Z" fill="#4b5563"/>
  <text x="318" y="776" font-size="17" font-weight="700" fill="#374151">こまめに落とす</text>
  <rect x="40" y="796" width="520" height="84" rx="10" fill="#ffffff" stroke="#c9ced4" stroke-width="1.5"/>
  <text x="60" y="830" font-size="22" font-weight="700" fill="#1f2937">中性の洗剤</text>
  <text x="182" y="829" font-size="16" fill="#6b7280">刺激は穏やか</text>
  <text x="60" y="862" font-size="17" fill="#374151">固着した汚れには力不足</text>
  <rect x="20" y="918" width="560" height="139" rx="12" fill="#fdecec" stroke="#e57373" stroke-width="2"/>
  <text x="40" y="950" font-size="18" font-weight="700" fill="#b42318">注意</text>
  <text x="40" y="981" font-size="17" font-weight="700" fill="#b42318">酸性と塩素系が混ざると、有毒な塩素ガスが出る</text>
  <text x="40" y="1010" font-size="17" fill="#374151">同時に使わなくても、流し残しがあれば便器の中で混ざる。</text>
  <text x="40" y="1039" font-size="17" fill="#374151">続けて使うなら間に水でよく流し、日を分けるのが確実</text>
</svg>
