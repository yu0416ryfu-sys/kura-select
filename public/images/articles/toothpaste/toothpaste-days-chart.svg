<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" font-family="'Hiragino Sans','Noto Sans JP',system-ui,sans-serif">
  <title>歯磨き粉1本が何日もつかの図</title>
  <rect width="600" height="450" fill="#ffffff"/>
  <text x="300" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2937">容量で1本がもつ日数は大きく違う</text>
  <text x="300" y="76" text-anchor="middle" font-size="17" fill="#6b7280">1人で1日2回、1回1gずつ使った場合（容量 ÷ 2g）</text>

  <!-- 基線 -->
  <line x1="120" y1="112" x2="120" y2="372" stroke="#d1d5db" stroke-width="1"/>

  <!-- 1か月の線: 30日 = 120 + 30 × 1.846 -->
  <line x1="175" y1="104" x2="175" y2="372" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="175" y="396" text-anchor="middle" font-size="15" fill="#374151">1か月</text>

  <!-- 半年の線: 180日 = 120 + 180 × 1.846 -->
  <line x1="452" y1="104" x2="452" y2="372" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="452" y="396" text-anchor="middle" font-size="15" fill="#374151">半年</text>

  <!-- 50g: 25日 -->
  <text x="108" y="140" text-anchor="end" font-size="17" fill="#374151">50g</text>
  <rect x="120" y="120" width="46" height="30" rx="4" fill="#2f6f9f"/>
  <text x="186" y="142" font-size="18" font-weight="700" fill="#1f2937">25日</text>

  <!-- 100g: 50日 -->
  <text x="108" y="192" text-anchor="end" font-size="17" fill="#374151">100g</text>
  <rect x="120" y="172" width="92" height="30" rx="4" fill="#2f6f9f"/>
  <text x="222" y="194" font-size="18" font-weight="700" fill="#1f2937">50日</text>

  <!-- 120g: 60日 -->
  <text x="108" y="244" text-anchor="end" font-size="17" fill="#374151">120g</text>
  <rect x="120" y="224" width="111" height="30" rx="4" fill="#2f6f9f"/>
  <text x="241" y="246" font-size="18" font-weight="700" fill="#1f2937">60日</text>

  <!-- 130g: 65日 -->
  <text x="108" y="296" text-anchor="end" font-size="17" fill="#374151">130g</text>
  <rect x="120" y="276" width="120" height="30" rx="4" fill="#2f6f9f"/>
  <text x="250" y="298" font-size="18" font-weight="700" fill="#1f2937">65日</text>

  <!-- 130g×3本: 195日 -->
  <text x="108" y="348" text-anchor="end" font-size="17" fill="#374151">130g×3本</text>
  <rect x="120" y="328" width="360" height="30" rx="4" fill="#d97706"/>
  <text x="490" y="350" font-size="18" font-weight="700" fill="#1f2937">195日</text>

  <text x="300" y="428" text-anchor="middle" font-size="14" fill="#6b7280">オレンジは半年を超える量。容量と1回の量から計算した当サイトの目安</text>
</svg>
