<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="600" height="520" font-family="'Hiragino Sans','Noto Sans JP',system-ui,sans-serif">
  <title>歯の色の原因ごとにできることの図</title>
  <rect width="600" height="520" fill="#ffffff"/>
  <text x="300" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2937">原因で、できることが違う</text>
  <text x="300" y="76" text-anchor="middle" font-size="17" fill="#6b7280">落としたいものが何かを先に確かめる</text>

  <!-- 表面の着色 -->
  <rect x="24" y="100" width="552" height="130" rx="8" fill="#f3f4f6"/>
  <rect x="24" y="100" width="210" height="130" rx="8" fill="#d97706"/>
  <text x="129" y="146" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">表面の着色</text>
  <text x="129" y="176" text-anchor="middle" font-size="15" fill="#ffffff">茶渋・コーヒー</text>
  <text x="129" y="198" text-anchor="middle" font-size="15" fill="#ffffff">タバコのヤニ</text>
  <text x="252" y="156" font-size="18" font-weight="700" fill="#1f2937">歯磨き粉で落とせる範囲がある</text>
  <text x="252" y="186" font-size="16" fill="#374151">残るなら歯科のクリーニング</text>

  <!-- 歯そのものの色 -->
  <rect x="24" y="242" width="552" height="130" rx="8" fill="#f3f4f6"/>
  <rect x="24" y="242" width="210" height="130" rx="8" fill="#2f6f9f"/>
  <text x="129" y="288" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">歯そのものの色</text>
  <text x="129" y="318" text-anchor="middle" font-size="15" fill="#ffffff">内側の象牙質の色が</text>
  <text x="129" y="340" text-anchor="middle" font-size="15" fill="#ffffff">透けて見える</text>
  <text x="252" y="298" font-size="18" font-weight="700" fill="#1f2937">目標は本来の歯の色まで</text>
  <text x="252" y="328" font-size="16" fill="#374151">より明るくするなら歯科で相談</text>

  <!-- 歯石 -->
  <rect x="24" y="384" width="552" height="130" rx="8" fill="#f3f4f6"/>
  <rect x="24" y="384" width="210" height="130" rx="8" fill="#6b7280"/>
  <text x="129" y="442" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">歯石</text>
  <text x="129" y="472" text-anchor="middle" font-size="15" fill="#ffffff">固まった汚れ</text>
  <text x="252" y="440" font-size="18" font-weight="700" fill="#1f2937">歯磨き粉では取れない</text>
  <text x="252" y="470" font-size="16" fill="#374151">歯科で除去する</text>
</svg>
