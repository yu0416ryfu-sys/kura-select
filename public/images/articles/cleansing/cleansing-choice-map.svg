<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1010" width="600" height="1010" font-family="'Hiragino Sans','Noto Sans JP',system-ui,sans-serif">
  <title>クレンジングの選び方</title>
  <rect width="600" height="1010" fill="#ffffff"/>
  <text x="300" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2937">クレンジングの選び方</text>
  <text x="300" y="76" text-anchor="middle" font-size="17" fill="#6b7280">使える条件で絞ってから、1回あたりで比べる</text>

  <!-- ① マツエク -->
  <rect x="20" y="100" width="560" height="230" rx="14" fill="#eef5ff" stroke="#8fb4e8" stroke-width="2"/>
  <rect x="40" y="118" width="300" height="40" rx="20" fill="#2f6fdb"/>
  <text x="190" y="145" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">① マツエクをしている？</text>
  <rect x="40" y="176" width="256" height="136" rx="10" fill="#ffffff" stroke="#8fb4e8" stroke-width="1.5"/>
  <text x="168" y="204" text-anchor="middle" font-size="16" fill="#374151">している</text>
  <path d="M158 214 L168 228 L178 214 Z" fill="#2f6fdb"/>
  <text x="168" y="256" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">商品の表示を確かめる</text>
  <text x="168" y="284" text-anchor="middle" font-size="15" fill="#374151">「マツエクOK」を選び</text>
  <text x="168" y="304" text-anchor="middle" font-size="15" fill="#374151">「使用不可」は避ける</text>
  <rect x="304" y="176" width="256" height="136" rx="10" fill="#ffffff" stroke="#8fb4e8" stroke-width="1.5"/>
  <text x="432" y="204" text-anchor="middle" font-size="16" fill="#374151">していない</text>
  <path d="M422 214 L432 228 L442 214 Z" fill="#2f6fdb"/>
  <text x="432" y="256" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">タイプは自由に選べる</text>
  <text x="432" y="284" text-anchor="middle" font-size="15" fill="#374151">落とす場所と</text>
  <text x="432" y="304" text-anchor="middle" font-size="15" fill="#374151">メイクの濃さで絞る</text>

  <!-- ② 落とす場所 -->
  <rect x="20" y="350" width="560" height="250" rx="14" fill="#f0faf3" stroke="#8cc9a0" stroke-width="2"/>
  <rect x="40" y="368" width="300" height="40" rx="20" fill="#2f8f57"/>
  <text x="190" y="395" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">② どこで落とす？</text>
  <rect x="40" y="426" width="166" height="156" rx="10" fill="#ffffff" stroke="#8cc9a0" stroke-width="1.5"/>
  <text x="123" y="454" text-anchor="middle" font-size="16" fill="#374151">浴室で落とす</text>
  <path d="M113 464 L123 478 L133 464 Z" fill="#2f8f57"/>
  <text x="123" y="508" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">濡れた手OK</text>
  <text x="123" y="534" text-anchor="middle" font-size="15" fill="#374151">の表示を見る</text>
  <text x="123" y="562" text-anchor="middle" font-size="14" fill="#6b7280">水気は軽くきる</text>
  <rect x="217" y="426" width="166" height="156" rx="10" fill="#ffffff" stroke="#8cc9a0" stroke-width="1.5"/>
  <text x="300" y="454" text-anchor="middle" font-size="16" fill="#374151">洗面所で落とす</text>
  <path d="M290 464 L300 478 L310 464 Z" fill="#2f8f57"/>
  <text x="300" y="508" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">乾いた手で</text>
  <text x="300" y="534" text-anchor="middle" font-size="15" fill="#374151">使う商品も候補</text>
  <text x="300" y="562" text-anchor="middle" font-size="14" fill="#6b7280">オイル・バームなど</text>
  <rect x="394" y="426" width="166" height="156" rx="10" fill="#ffffff" stroke="#8cc9a0" stroke-width="1.5"/>
  <text x="477" y="454" text-anchor="middle" font-size="16" fill="#374151">洗い流さない</text>
  <path d="M467 464 L477 478 L487 464 Z" fill="#2f8f57"/>
  <text x="477" y="508" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">ふき取り</text>
  <text x="477" y="534" text-anchor="middle" font-size="15" fill="#374151">ウォーター・ミルク</text>
  <text x="477" y="562" text-anchor="middle" font-size="14" fill="#6b7280">コットン代が別にかかる</text>

  <!-- ③ メイクの濃さ -->
  <rect x="20" y="620" width="560" height="250" rx="14" fill="#fff6ec" stroke="#e8b27a" stroke-width="2"/>
  <rect x="40" y="638" width="300" height="40" rx="20" fill="#c8741f"/>
  <text x="190" y="665" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">③ メイクの濃さは？</text>
  <rect x="40" y="696" width="166" height="156" rx="10" fill="#ffffff" stroke="#e8b27a" stroke-width="1.5"/>
  <text x="123" y="724" text-anchor="middle" font-size="16" fill="#374151">濃いアイメイク</text>
  <path d="M113 734 L123 748 L133 734 Z" fill="#c8741f"/>
  <text x="123" y="778" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">オイル</text>
  <text x="123" y="806" text-anchor="middle" font-size="15" fill="#374151">残るなら</text>
  <text x="123" y="828" text-anchor="middle" font-size="15" fill="#374151">リムーバーを併用</text>
  <rect x="217" y="696" width="166" height="156" rx="10" fill="#ffffff" stroke="#e8b27a" stroke-width="1.5"/>
  <text x="300" y="724" text-anchor="middle" font-size="16" fill="#374151">ふつうのメイク</text>
  <path d="M290 734 L300 748 L310 734 Z" fill="#c8741f"/>
  <text x="300" y="778" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">オイル・バーム</text>
  <text x="300" y="802" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">ジェル</text>
  <text x="300" y="828" text-anchor="middle" font-size="15" fill="#374151">使い心地の好みで</text>
  <rect x="394" y="696" width="166" height="156" rx="10" fill="#ffffff" stroke="#e8b27a" stroke-width="1.5"/>
  <text x="477" y="724" text-anchor="middle" font-size="16" fill="#374151">日焼け止め・薄め</text>
  <path d="M467 734 L477 748 L487 734 Z" fill="#c8741f"/>
  <text x="477" y="778" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">ミルク・ふき取り</text>
  <text x="477" y="806" text-anchor="middle" font-size="15" fill="#374151">「石けんで落ちる」</text>
  <text x="477" y="828" text-anchor="middle" font-size="15" fill="#374151">日焼け止めは洗顔料で</text>

  <!-- 1回あたり -->
  <rect x="20" y="890" width="560" height="100" rx="14" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="300" y="928" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">1回あたり ＝ 価格 ÷ 使える回数</text>
  <text x="300" y="962" text-anchor="middle" font-size="16" fill="#374151">＋ 洗顔料（W洗顔が要るとき）＋ コットン（ふき取り）</text>
</svg>
