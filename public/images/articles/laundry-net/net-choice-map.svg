<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1073" width="600" height="1073" font-family="'Hiragino Sans','Noto Sans JP',system-ui,sans-serif">
  <title>衣類に合わせたネットの選び方</title>
  <rect width="600" height="1073" fill="#ffffff"/>
  <text x="300" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2937">衣類に合わせたネットの選び方</text>
  <text x="300" y="76" text-anchor="middle" font-size="17" fill="#6b7280">守る力と、よく洗えることはトレードオフ</text>
  <rect x="20" y="102" width="560" height="252" rx="14" fill="#f3effb" stroke="#b9a6e3" stroke-width="2"/>
  <rect x="40" y="120" width="280" height="40" rx="20" fill="#6b4fb3"/>
  <text x="180" y="147" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">摩擦や型崩れから守りたい</text>
  <text x="40" y="198" font-size="19" fill="#374151">ニット、刺繍のあるもの、レース、飾りのついた衣類</text>
  <line x1="300" y1="210" x2="300" y2="232" stroke="#6b4fb3" stroke-width="3"/>
  <path d="M290 228 L300 242 L310 228 Z" fill="#6b4fb3"/>
  <text x="318" y="232" font-size="17" font-weight="700" fill="#4a3485">向いているのは</text>
  <rect x="40" y="252" width="520" height="84" rx="10" fill="#ffffff" stroke="#b9a6e3" stroke-width="1.5"/>
  <text x="60" y="286" font-size="22" font-weight="700" fill="#1f2937">目の細かいネット</text>
  <text x="60" y="318" font-size="17" fill="#374151">守る力は強いが、水と洗剤は通りにくい</text>
  <rect x="20" y="374" width="560" height="252" rx="14" fill="#eef5fc" stroke="#8db6e3" stroke-width="2"/>
  <rect x="40" y="392" width="280" height="40" rx="20" fill="#2f6fb5"/>
  <text x="180" y="419" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">汚れをしっかり落としたい</text>
  <text x="40" y="470" font-size="19" fill="#374151">汗や皮脂で汚れたシャツ、タオル類</text>
  <line x1="300" y1="482" x2="300" y2="504" stroke="#2f6fb5" stroke-width="3"/>
  <path d="M290 500 L300 514 L310 500 Z" fill="#2f6fb5"/>
  <text x="318" y="504" font-size="17" font-weight="700" fill="#1f4f87">向いているのは</text>
  <rect x="40" y="524" width="520" height="84" rx="10" fill="#ffffff" stroke="#8db6e3" stroke-width="1.5"/>
  <text x="60" y="558" font-size="22" font-weight="700" fill="#1f2937">目の粗いネット</text>
  <text x="60" y="590" font-size="17" fill="#374151">よく洗えるが、守る力は弱い</text>
  <rect x="20" y="646" width="560" height="252" rx="14" fill="#f5f6f7" stroke="#c9ced4" stroke-width="2"/>
  <rect x="40" y="664" width="240" height="40" rx="20" fill="#4b5563"/>
  <text x="160" y="691" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">カップの形を保ちたい</text>
  <text x="40" y="742" font-size="19" fill="#374151">ブラジャー</text>
  <line x1="300" y1="754" x2="300" y2="776" stroke="#4b5563" stroke-width="3"/>
  <path d="M290 772 L300 786 L310 772 Z" fill="#4b5563"/>
  <text x="318" y="776" font-size="17" font-weight="700" fill="#374151">向いているのは</text>
  <rect x="40" y="796" width="520" height="84" rx="10" fill="#ffffff" stroke="#c9ced4" stroke-width="1.5"/>
  <text x="60" y="830" font-size="22" font-weight="700" fill="#1f2937">立体的なブラジャー用ネット</text>
  <text x="60" y="862" font-size="17" fill="#374151">たたまずに形を保ったまま入れる</text>
  <rect x="20" y="918" width="560" height="139" rx="12" fill="#f5f6f7" stroke="#c9ced4" stroke-width="2"/>
  <text x="40" y="950" font-size="18" font-weight="700" fill="#374151">どのネットでも共通</text>
  <text x="40" y="981" font-size="17" fill="#374151">衣類がちょうど収まる大きさにし、1つのネットに1〜2点まで</text>
  <text x="40" y="1010" font-size="17" fill="#374151">ファスナーの引き手を隠すカバーが付いているか</text>
  <text x="40" y="1039" font-size="17" fill="#374151">ドラム式なら、方式に合った製品か</text>
</svg>
