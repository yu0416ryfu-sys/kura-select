<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" width="600" height="470" font-family="'Hiragino Sans','Noto Sans JP',system-ui,sans-serif">
  <title>バスマットの厚みと扉の下のすき間</title>
  <rect width="600" height="470" fill="#ffffff"/>
  <text x="300" y="38" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2937">厚みは、扉の下のすき間と比べる</text>
  <text x="300" y="64" text-anchor="middle" font-size="14" fill="#6b7280">脱衣所の扉を閉めて横から見た図（厚みは販売ページの表示の例）</text>

  <!-- 扉 -->
  <rect x="40" y="90" width="34" height="160" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
  <text x="57" y="112" text-anchor="middle" font-size="14" fill="#374151">扉</text>

  <!-- 扉の下端の線 -->
  <line x1="40" y1="250" x2="570" y2="250" stroke="#b45309" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="566" y="242" text-anchor="end" font-size="13" fill="#b45309">扉の下端（すき間の高さは家ごとに違う）</text>

  <!-- すき間の寸法 -->
  <line x1="92" y1="250" x2="92" y2="290" stroke="#2f6fb5" stroke-width="2"/>
  <path d="M86 258 L92 250 L98 258 M86 282 L92 290 L98 282" fill="none" stroke="#2f6fb5" stroke-width="2"/>
  <text x="102" y="268" font-size="13" fill="#2f6fb5">ここを</text>
  <text x="102" y="284" font-size="13" fill="#2f6fb5">測る</text>

  <!-- 床 -->
  <line x1="30" y1="290" x2="580" y2="290" stroke="#374151" stroke-width="3"/>

  <!-- 厚手の吸水繊維 約29mm -->
  <rect x="160" y="218" width="96" height="72" rx="6" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
  <path d="M164 222 l6 -8 l6 8 l6 -8 l6 8 l6 -8 l6 8 l6 -8 l6 8 l6 -8 l6 8 l6 -8 l6 8 l6 -8 l6 8" fill="none" stroke="#92400e" stroke-width="1.5"/>
  <text x="208" y="314" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">厚手の吸水繊維</text>
  <text x="208" y="332" text-anchor="middle" font-size="13" fill="#374151">表示の一例 約29mm</text>
  <text x="208" y="350" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">扉に当たりやすい</text>

  <!-- 硬い珪藻土 9mm -->
  <rect x="280" y="268" width="88" height="22" fill="#d1d5db" stroke="#4b5563" stroke-width="2"/>
  <text x="324" y="314" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">硬い珪藻土</text>
  <text x="324" y="332" text-anchor="middle" font-size="13" fill="#374151">表示の一例 9mm</text>

  <!-- やわらかい珪藻土 5mm -->
  <rect x="390" y="278" width="80" height="12" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
  <text x="430" y="314" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">やわらかい珪藻土</text>
  <text x="430" y="332" text-anchor="middle" font-size="13" fill="#374151">表示の一例 5mm</text>

  <!-- 綿のタオル地 記載なし -->
  <rect x="492" y="280" width="78" height="10" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="531" y="314" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">綿のタオル地</text>
  <text x="531" y="332" text-anchor="middle" font-size="13" fill="#374151">厚みの記載なし</text>

  <!-- 手順 -->
  <rect x="30" y="372" width="540" height="84" rx="8" fill="#f3f4f6"/>
  <text x="48" y="398" font-size="14" fill="#1f2937">1. 扉を閉め、床から扉の下端までを測る</text>
  <text x="48" y="422" font-size="14" fill="#1f2937">2. 販売ページのマットの厚み（高さ）の表示と比べる</text>
  <text x="48" y="446" font-size="14" fill="#1f2937">3. 洗面台の引き出しや洗濯機の扉が開く範囲にも重ならないか見る</text>
</svg>
