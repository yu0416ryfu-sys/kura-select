<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" width="600" height="760" font-family="'Hiragino Sans','Noto Sans JP',system-ui,sans-serif">
  <title>リップクリームの3つの区分と、表示できること</title>
  <rect width="600" height="760" fill="#ffffff"/>
  <text x="300" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2937">区分で「言えること」が違う</text>
  <text x="300" y="76" text-anchor="middle" font-size="17" fill="#6b7280">商品ページの「化粧品」「医薬部外品」「医薬品」を見る</text>

  <!-- 化粧品 -->
  <rect x="20" y="100" width="560" height="196" rx="14" fill="#f5f3fb" stroke="#b7acd9" stroke-width="2"/>
  <rect x="40" y="118" width="130" height="40" rx="20" fill="#6a56a8"/>
  <text x="105" y="145" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">化粧品</text>
  <text x="190" y="145" font-size="16" fill="#6b7280">この記事では3本</text>
  <text x="40" y="190" font-size="18" fill="#374151">唇の効能として言えるのは通知の7つ</text>
  <text x="40" y="218" font-size="17" fill="#374151">荒れを防ぐ・うるおいを与える・すこやかにする</text>
  <text x="40" y="244" font-size="17" fill="#374151">保護する・乾燥を防ぐ・カサツキを防ぐ ほか</text>
  <text x="40" y="276" font-size="16" fill="#6b7280">有効成分の表示はない</text>

  <!-- 医薬部外品 -->
  <rect x="20" y="312" width="560" height="196" rx="14" fill="#eef5fc" stroke="#8db6e3" stroke-width="2"/>
  <rect x="40" y="330" width="220" height="40" rx="20" fill="#2f6fb5"/>
  <text x="150" y="357" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">医薬部外品（薬用）</text>
  <text x="280" y="357" font-size="16" fill="#6b7280">この記事では7本</text>
  <text x="40" y="402" font-size="18" fill="#374151">有効成分が書かれている</text>
  <text x="40" y="430" font-size="17" fill="#374151">効能を書く商品は「荒れ・乾燥・ひび割れを防ぐ」</text>
  <text x="40" y="470" font-size="18" font-weight="700" fill="#1f4f86">防ぐもので、治すものではない</text>

  <!-- 医薬品 -->
  <rect x="20" y="524" width="560" height="216" rx="14" fill="#fdf0ee" stroke="#e3a197" stroke-width="2"/>
  <rect x="40" y="542" width="220" height="40" rx="20" fill="#b84a3a"/>
  <text x="150" y="569" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">医薬品（第3類など）</text>
  <text x="280" y="569" font-size="16" fill="#6b7280">この記事には入れていない</text>
  <text x="40" y="614" font-size="18" fill="#374151">効能に症状が書かれる</text>
  <text x="40" y="642" font-size="17" fill="#374151">口唇のひびわれ・ただれ・口唇炎・口角炎</text>
  <text x="40" y="682" font-size="17" fill="#374151">5〜6日使ってよくならなければ</text>
  <text x="40" y="708" font-size="17" fill="#374151">使用をやめて医師・薬剤師などに相談</text>
</svg>
