<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" font-family="'Hiragino Sans','Noto Sans JP',system-ui,sans-serif">
  <title>同じサイズ記号でも、合うウエストはブランドで違う</title>
  <style>text{paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round}</style>
  <rect width="600" height="450" fill="#ffffff"/>
  <text x="300" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#1f2937">同じ「M」でも、合うウエストは違う</text>
  <text x="300" y="54" text-anchor="middle" font-size="13" fill="#6b7280">比較表のパンツの販売ページに書かれた適合ウエスト（cm）を同じ目盛りに並べた図</text>

  <!-- 目盛りの縦線 x = 150 + (cm - 45) * 4.941 -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="174.7" y1="70" x2="174.7" y2="392"/>
    <line x1="224.1" y1="70" x2="224.1" y2="392"/>
    <line x1="273.5" y1="70" x2="273.5" y2="392"/>
    <line x1="322.9" y1="70" x2="322.9" y2="392"/>
    <line x1="372.4" y1="70" x2="372.4" y2="392"/>
    <line x1="421.8" y1="70" x2="421.8" y2="392"/>
    <line x1="471.2" y1="70" x2="471.2" y2="392"/>
    <line x1="520.6" y1="70" x2="520.6" y2="392"/>
    <line x1="570" y1="70" x2="570" y2="392"/>
  </g>

  <!-- ウエスト92cm の線 -->
  <line x1="382.2" y1="72" x2="382.2" y2="392" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="330" y="64" width="104" height="22" rx="4" fill="#fff7ed" stroke="#b45309" stroke-width="1"/>
  <text x="382.2" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">ウエスト92cm</text>

  <!-- 白十字 サルバ（うす型やわ楽パンツ） -->
  <text x="20" y="104" font-size="14" font-weight="700" fill="#1f2937">白十字 サルバ（うす型やわ楽パンツ）</text>
  <g font-size="13" text-anchor="end" fill="#374151">
    <text x="140" y="124">S</text>
    <text x="140" y="144">M</text>
    <text x="140" y="164" font-weight="700" fill="#b45309">L</text>
    <text x="140" y="184">LL</text>
  </g>
  <rect x="199.4" y="113" width="98.8" height="14" rx="3" fill="#93c5fd"/>
  <rect x="224.1" y="133" width="148.3" height="14" rx="3" fill="#93c5fd"/>
  <rect x="322.9" y="153" width="173" height="14" rx="3" fill="#f59e0b"/>
  <rect x="421.8" y="173" width="123.5" height="14" rx="3" fill="#93c5fd"/>

  <!-- シンズ リラパンツ -->
  <text x="20" y="214" font-size="14" font-weight="700" fill="#1f2937">シンズ リラパンツ</text>
  <g font-size="13" text-anchor="end" fill="#374151">
    <text x="140" y="234">S</text>
    <text x="140" y="254">M</text>
    <text x="140" y="274" font-weight="700" fill="#b45309">L</text>
    <text x="140" y="294" font-weight="700" fill="#b45309">XL</text>
  </g>
  <rect x="174.7" y="223" width="98.8" height="14" rx="3" fill="#93c5fd"/>
  <rect x="224.1" y="243" width="123.5" height="14" rx="3" fill="#93c5fd"/>
  <rect x="298.2" y="263" width="123.6" height="14" rx="3" fill="#f59e0b"/>
  <rect x="372.4" y="283" width="172.9" height="14" rx="3" fill="#f59e0b"/>

  <!-- 第一衛材 フリーネ -->
  <text x="20" y="324" font-size="14" font-weight="700" fill="#1f2937">第一衛材 フリーネ（Pro 軽快パンツ）</text>
  <g font-size="13" text-anchor="end" fill="#374151">
    <text x="140" y="344" font-weight="700" fill="#b45309">M</text>
    <text x="140" y="364" font-weight="700" fill="#b45309">L</text>
  </g>
  <rect x="224.1" y="333" width="173" height="14" rx="3" fill="#f59e0b"/>
  <rect x="347.6" y="353" width="197.7" height="14" rx="3" fill="#f59e0b"/>

  <!-- DFree -->
  <text x="20" y="384" font-size="14" font-weight="700" fill="#1f2937">DFree</text>
  <text x="140" y="384" font-size="13" text-anchor="end" fill="#374151">M</text>
  <rect x="224.1" y="373" width="148.3" height="14" rx="3" fill="#93c5fd"/>

  <!-- 目盛り -->
  <line x1="150" y1="396" x2="570" y2="396" stroke="#9ca3af" stroke-width="1.5"/>
  <g font-size="12" text-anchor="middle" fill="#6b7280">
    <text x="174.7" y="413">50</text>
    <text x="224.1" y="413">60</text>
    <text x="273.5" y="413">70</text>
    <text x="322.9" y="413">80</text>
    <text x="372.4" y="413">90</text>
    <text x="421.8" y="413">100</text>
    <text x="471.2" y="413">110</text>
    <text x="520.6" y="413">120</text>
    <text x="570" y="413">130</text>
  </g>
  <text x="560" y="432" text-anchor="end" font-size="12" fill="#6b7280">ウエスト（cm）　橙＝92cm が範囲に入るサイズ</text>
</svg>
