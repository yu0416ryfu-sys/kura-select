<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 933" width="600" height="933" font-family="'Hiragino Sans','Noto Sans JP',system-ui,sans-serif">
  <title>紙おむつの選び方の流れ</title>
  <rect width="600" height="933" fill="#ffffff"/>
  <text x="300" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2937">紙おむつの選び方の流れ</text>
  <text x="300" y="76" text-anchor="middle" font-size="17" fill="#6b7280">成長に合わせて、サイズと形状が変わる</text>
  <rect x="20" y="102" width="560" height="294" rx="14" fill="#eef5fc" stroke="#8db6e3" stroke-width="2"/>
  <rect x="40" y="120" width="340" height="40" rx="20" fill="#2f6fb5"/>
  <text x="210" y="147" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">テープ型（寝ている時期が中心）</text>
  <rect x="40" y="172" width="250" height="110" rx="10" fill="#ffffff" stroke="#8db6e3" stroke-width="1.5"/>
  <text x="60" y="206" font-size="22" font-weight="700" fill="#1f2937">新生児用</text>
  <text x="60" y="238" font-size="17" fill="#374151">肌へのやさしさと</text>
  <text x="60" y="264" font-size="17" fill="#374151">サイズアウトの早さ</text>
  <rect x="310" y="172" width="250" height="110" rx="10" fill="#ffffff" stroke="#8db6e3" stroke-width="1.5"/>
  <text x="330" y="206" font-size="22" font-weight="700" fill="#1f2937">Sサイズ</text>
  <text x="330" y="238" font-size="17" fill="#374151">1枚単価と漏れにくさ</text>
  <rect x="40" y="294" width="250" height="84" rx="10" fill="#ffffff" stroke="#8db6e3" stroke-width="1.5"/>
  <text x="60" y="328" font-size="22" font-weight="700" fill="#1f2937">Mサイズ</text>
  <text x="60" y="360" font-size="17" fill="#374151">1枚単価と漏れにくさ</text>
  <rect x="310" y="294" width="250" height="84" rx="10" fill="#ffffff" stroke="#8db6e3" stroke-width="1.5"/>
  <text x="330" y="328" font-size="22" font-weight="700" fill="#1f2937">BIG以上</text>
  <text x="330" y="360" font-size="17" fill="#374151">フィット感と単価</text>
  <line x1="300" y1="400" x2="300" y2="422" stroke="#2f6fb5" stroke-width="3"/>
  <path d="M290 418 L300 432 L310 418 Z" fill="#2f6fb5"/>
  <text x="318" y="418" font-size="17" font-weight="700" fill="#1f4f87">動くようになったら</text>
  <rect x="20" y="438" width="560" height="320" rx="14" fill="#edf7f1" stroke="#8fc9a8" stroke-width="2"/>
  <rect x="40" y="456" width="240" height="40" rx="20" fill="#2f8a5b"/>
  <text x="160" y="483" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">パンツ型（動く時期）</text>
  <rect x="40" y="508" width="250" height="110" rx="10" fill="#ffffff" stroke="#8fc9a8" stroke-width="1.5"/>
  <text x="60" y="542" font-size="22" font-weight="700" fill="#1f2937">Mサイズ</text>
  <text x="60" y="574" font-size="17" fill="#374151">テープ型から</text>
  <text x="60" y="600" font-size="17" fill="#374151">切り替えたばかり</text>
  <rect x="310" y="508" width="250" height="110" rx="10" fill="#ffffff" stroke="#8fc9a8" stroke-width="1.5"/>
  <text x="330" y="542" font-size="22" font-weight="700" fill="#1f2937">Lサイズ</text>
  <text x="330" y="574" font-size="17" fill="#374151">歩き始めて</text>
  <text x="330" y="600" font-size="17" fill="#374151">活動量が増えた</text>
  <rect x="40" y="630" width="250" height="110" rx="10" fill="#ffffff" stroke="#8fc9a8" stroke-width="1.5"/>
  <text x="60" y="664" font-size="22" font-weight="700" fill="#1f2937">BIGサイズ</text>
  <text x="60" y="696" font-size="17" fill="#374151">卒業までの期間と</text>
  <text x="60" y="722" font-size="17" fill="#374151">コスパ</text>
  <rect x="310" y="630" width="250" height="110" rx="10" fill="#ffffff" stroke="#8fc9a8" stroke-width="1.5"/>
  <text x="330" y="664" font-size="22" font-weight="700" fill="#1f2937">夜用パンツ</text>
  <text x="330" y="696" font-size="17" fill="#374151">朝までの漏れが</text>
  <text x="330" y="722" font-size="17" fill="#374151">気になる</text>
  <rect x="20" y="778" width="560" height="139" rx="12" fill="#f5f6f7" stroke="#c9ced4" stroke-width="2"/>
  <text x="40" y="810" font-size="18" font-weight="700" fill="#374151">サイズアップのサイン</text>
  <text x="40" y="841" font-size="17" fill="#374151">お腹や太ももに強い跡が残る</text>
  <text x="40" y="870" font-size="17" fill="#374151">背中漏れや太もも漏れが増える</text>
  <text x="40" y="899" font-size="17" fill="#374151">テープの留め位置が外側になってきた</text>
</svg>
