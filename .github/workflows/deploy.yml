name: GitHub Pagesへデプロイ

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # IndexNow が「直前のコミットで変わった記事」を git diff で拾うため
          fetch-depth: 2

      # OGP画像（scripts/generate-ogp.mjs）はsharp/librsvgでSVGテキストをラスタライズするため、
      # ランナーに日本語フォントが無いと日本語が豆腐（□）になる
      - name: 日本語フォントのインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-noto-color-emoji
          fc-cache -f
          fc-list :lang=ja family | head -20

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 依存関係インストール
        run: pnpm install

      - name: ビルド
        run: pnpm build
        env:
          PUBLIC_RAKUTEN_AFFILIATE_ID: ${{ secrets.PUBLIC_RAKUTEN_AFFILIATE_ID }}
          PUBLIC_ENABLE_YAHOO_AFFILIATE: "true"
          PUBLIC_ENABLE_AMAZON_AFFILIATE: "true"
          AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG }}
          PUBLIC_NOINDEX: "false"
          VALUECOMMERCE_SID: ${{ secrets.VALUECOMMERCE_SID }}
          VALUECOMMERCE_PID: ${{ secrets.VALUECOMMERCE_PID }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pagesへデプロイ
        id: deployment
        uses: actions/deploy-pages@v4

  # Bing（送客第1チャネル）に更新 URL を能動通知する。
  # 公開が完了してから走らせないと、クロール時にまだ旧版が返るため deploy の後段に置く。
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: IndexNowへ更新URLを通知
        run: node scripts/indexnow-submit.mjs
